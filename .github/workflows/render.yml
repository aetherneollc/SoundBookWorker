name: Render episode
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Unique render job ID
        required: true
        type: string
      manifest_key:
        description: R2 object key for manifest JSON
        required: true
        type: string
      qa_mode:
        description: Render an isolated QA artifact without updating a studio episode
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: render-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install FFmpeg and Chinese font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p "$HOME/.local/share/fonts"
          curl -fsSL --retry 3 --max-time 120 \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf \
            -o "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          curl -fsSL --retry 3 --max-time 120 \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Bold.otf \
            -o "$HOME/.local/share/fonts/NotoSansCJKsc-Bold.otf"
          fc-cache -f "$HOME/.local/share/fonts"
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install S3 client
        run: python -m pip install boto3 'qrcode[pil]'
      - name: Download manifest and media
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MANIFEST_KEY: ${{ inputs.manifest_key }}
        run: |
          python - <<'PY'
          import os, boto3, json
          from pathlib import Path
          s3=boto3.client('s3',endpoint_url=os.environ['R2_ENDPOINT'],aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],region_name='auto')
          bucket=os.environ['R2_BUCKET']
          s3.download_file(bucket,os.environ['MANIFEST_KEY'],'manifest.json')
          doc=json.loads(Path('manifest.json').read_text())
          Path('media').mkdir(exist_ok=True)
          n=0
          for group in [doc.get('shots',[]), [doc['audio']] if doc.get('audio') else [], doc.get('audio_tracks',[]), [doc['subtitle']] if doc.get('subtitle') else []]:
              for item in group:
                  key=item.get('key')
                  if key:
                      n+=1
                      name=f"media/{n:05d}-{Path(key).name}"
                      s3.download_file(bucket,key,name)
                      item['file']=name
          # A character rig is a reusable set of R2 sprites, not a single image.
          for shot in doc.get('shots', []):
              layers=shot.get('character_layers')
              if not isinstance(layers, dict):
                  continue
              for part in ('background','body','head','arm_left','arm_right'):
                  key=layers.get(f'{part}_key')
                  if key:
                      n+=1
                      name=f"media/{n:05d}-{Path(key).name}"
                      s3.download_file(bucket,key,name)
                      layers[f'{part}_file']=name
              if isinstance(layers.get('mouth_keys'), dict):
                  layers['mouth_files']={}
                  for shape,key in layers['mouth_keys'].items():
                      if shape not in 'ABCDEFGHX' or not key:
                          continue
                      n+=1
                      name=f"media/{n:05d}-{Path(key).name}"
                      s3.download_file(bucket,key,name)
                      layers['mouth_files'][shape]=name
          portrait_files={}
          for shot in doc.get('shots', []):
              rover=shot.get('rover')
              if isinstance(rover, dict) and rover.get('body_key'):
                  key=rover['body_key']
                  if key not in portrait_files:
                      n+=1
                      name=f"media/{n:05d}-{Path(key).name}"
                      s3.download_file(bucket,key,name)
                      portrait_files[key]=name
                  rover['body_file']=portrait_files[key]
              cartoon=shot.get('cartoon')
              if not isinstance(cartoon, dict):
                  continue
              for actor in cartoon.get('actors', []):
                  if not isinstance(actor, dict):
                      continue
                  for part in ('portrait','mouth','body'):
                      key=actor.get(f'{part}_key')
                      if not key:
                          continue
                      if key not in portrait_files:
                          n+=1
                          name=f"media/{n:05d}-{Path(key).name}"
                          s3.download_file(bucket,key,name)
                          portrait_files[key]=name
                      actor[f'{part}_file']=portrait_files[key]
          for shot in doc.get('shots', []):
              stage=shot.get('stage')
              if not isinstance(stage, dict):
                  continue
              for part in ('background','foreground'):
                  key=stage.get(f'{part}_key')
                  if key:
                      n+=1
                      name=f"media/{n:05d}-{Path(key).name}"
                      s3.download_file(bucket,key,name)
                      stage[f'{part}_file']=name
              for actor in stage.get('cast', []):
                  if not isinstance(actor, dict) or not isinstance(actor.get('cells'), dict):
                      continue
                  for slot,key in list(actor['cells'].items()):
                      if not key:
                          continue
                      n+=1
                      name=f"media/{n:05d}-{Path(key).name}"
                      s3.download_file(bucket,key,name)
                      actor['cells'][slot]=name
          Path('manifest.json').write_text(json.dumps(doc))
          PY
      - name: Cache MOSS models
        if: ${{ hashFiles('manifest.json') != '' }}
        uses: actions/cache@v4
        with:
          path: moss-tts-nano/models
          key: moss-nano-onnx-v1-${{ runner.os }}
      - name: Compute speech cache key
        id: speech_cache
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          doc=json.loads(Path('manifest.json').read_text())
          lines={'language':doc.get('language'),
                 'lines':[(t.get('tts_text'),t.get('tts_voice')) for t in doc.get('audio_tracks', [])]}
          intro={'language':doc.get('language'), 'text':doc.get('intro_tts_text'),
                 'voice':doc.get('intro_tts_voice')}
          digest=lambda value: hashlib.sha256(json.dumps(value,ensure_ascii=False,sort_keys=True).encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f'key={digest(lines)}\n')
              out.write(f'intro_key={digest(intro)}\n')
          PY
      - name: Cache episode dialogue for rerenders
        id: speech_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: media/moss/line-*.wav
          key: moss-speech-v3-${{ runner.os }}-${{ steps.speech_cache.outputs.key }}
          restore-keys: |
            moss-speech-v3-${{ runner.os }}-
      - name: Cache episode announcement
        uses: actions/cache@v4
        with:
          path: media/moss/intro.wav
          key: moss-intro-v1-${{ runner.os }}-${{ steps.speech_cache.outputs.intro_key }}
      - name: Install MOSS CPU runtime
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('manifest.json').read_text())
          Path('needs-moss').write_text('yes' if doc.get('tts_engine')=='moss' else 'no')
          PY
          if [ "$(cat needs-moss)" = yes ]; then
            git clone https://github.com/OpenMOSS/MOSS-TTS-Nano.git moss-tts-source
            git -C moss-tts-source checkout 8b7bcc9341b3b4ef3a3a58ba1338a7d85ff133eb
            mkdir -p moss-tts-nano
            cp -a moss-tts-source/. moss-tts-nano/
            python -m pip install torch==2.7.0 torchaudio==2.7.0 --index-url https://download.pytorch.org/whl/cpu
            python -m pip install onnxruntime sentencepiece soundfile huggingface_hub transformers==4.57.1
            python -m pip install --no-deps -e moss-tts-nano
          fi
      - name: Generate MOSS speech
        id: speech_generate
        run: |
          if [ "$(cat needs-moss)" = yes ]; then
            python renderer/synthesize.py manifest.json
          fi
      - name: Save per-utterance MOSS cache
        if: ${{ always() && steps.speech_cache_restore.outputs.cache-hit != 'true' && steps.speech_generate.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: media/moss/line-*.wav
          key: moss-speech-v3-${{ runner.os }}-${{ steps.speech_cache.outputs.key }}
      - name: Cache anime segmentation model
        uses: actions/cache@v4
        with:
          path: character-model
          key: isnet-anime-onnx-v1-${{ runner.os }}
      - name: Install character layer runtime
        continue-on-error: true
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path
          shots=json.loads(Path('manifest.json').read_text()).get('shots', [])
          if not any(shot.get('pixel_story') and any(actor.get('body_file') for actor in (shot.get('cartoon') or {}).get('actors', []))
                     or shot.get('file') and not shot.get('pixel_story') and not shot.get('stage') and not shot.get('rover')
                     and not shot.get('fact_card') and not shot.get('label')
                     and not (isinstance(shot.get('character_layers'), dict)
                              and shot['character_layers'].get('body_file')) for shot in shots):
              raise SystemExit(1)
          PY
          then
            python -m pip install 'rembg[cpu]==2.0.67' 'opencv-python-headless==4.12.0.88'
          fi
      - name: Extract character layers
        env:
          U2NET_HOME: character-model
        run: python renderer/layer_shots.py manifest.json || echo 'Character masking unavailable; using original shots'
      - name: Prepare pixel story actors
        env:
          U2NET_HOME: character-model
        run: python renderer/pixel_actor_sprites.py manifest.json
      - name: Install phonetic lip sync when character mouth assets are present
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path
          shots=json.loads(Path('manifest.json').read_text()).get('shots', [])
          if not any(s.get('rover') or (isinstance(s.get('character_layers'), dict) and
                     (s['character_layers'].get('mouth_files') or s['character_layers'].get('mouth_mode') == 'led')) for s in shots):
              raise SystemExit(1)
          PY
          then
            curl -fsSL --retry 3 https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.14.0/Rhubarb-Lip-Sync-1.14.0-Linux.zip -o rhubarb.zip
            echo 'a9a9074862cff47b2d59b8bf399a678a3b0b74f9452ad6ad94cb292913dd8667  rhubarb.zip' | sha256sum -c -
            unzip -q rhubarb.zip -d rhubarb-runtime
            echo "RHUBARB_BIN=$PWD/rhubarb-runtime/Rhubarb-Lip-Sync-1.14.0-Linux/rhubarb" >> "$GITHUB_ENV"
          fi
      - name: Install Remotion
        run: npm ci
      - name: Prepare frame-accurate timeline
        run: python renderer/prepare_remotion.py manifest.json remotion-props.json
      - name: Render MP4 with Remotion
        run: npm run render
      - name: Inspect rendered video and build storyboard QA
        if: ${{ !inputs.qa_mode }}
        run: python renderer/quality_report.py manifest.json remotion-props.json output.mp4 qa
      - name: Upload video and QA evidence
        if: ${{ always() && !inputs.qa_mode && hashFiles('manifest.json') != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          python - <<'PY'
          import json, os, boto3
          from pathlib import Path
          s3=boto3.client('s3',endpoint_url=os.environ['R2_ENDPOINT'],aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],region_name='auto')
          bucket=os.environ['R2_BUCKET']; prefix=f"renders/{os.environ['JOB_ID']}/qa"
          files=sorted(Path('qa').glob('*')) if Path('qa').exists() else []
          for path in files:
              if path.is_file():
                  content_type={'jpg':'image/jpeg','json':'application/json','txt':'text/plain'}.get(path.suffix.lstrip('.'),'application/octet-stream')
                  s3.upload_file(str(path),bucket,f'{prefix}/{path.name}',ExtraArgs={'ContentType':content_type})
          if Path('output.mp4').is_file():
              s3.upload_file('output.mp4',bucket,f"renders/{os.environ['JOB_ID']}/output.mp4",ExtraArgs={'ContentType':'video/mp4'})
          report_path=Path('qa/report.json')
          report=json.loads(report_path.read_text()) if report_path.is_file() else None
          passed=bool(report and report.get('result')=='technical_pass_visual_review_required')
          status={'job_id':os.environ['JOB_ID'],'status':'succeeded' if passed else 'failed',
                  'quality_status':'visual_review_required' if passed else 'failed',
                  'quality_report_key':f"{prefix}/report.json" if report_path.is_file() else None,
                  'output_key':f"renders/{os.environ['JOB_ID']}/output.mp4" if Path('output.mp4').is_file() else None,
                  'error':None if passed else '; '.join((report or {}).get('issues',[]))[:900] or 'render or technical QA did not complete'}
          s3.put_object(Bucket=bucket,Key=f"renders/{os.environ['JOB_ID']}/status.json",Body=__import__('json').dumps(status).encode(),ContentType='application/json')
          PY
      - name: Mark failed
        if: ${{ failure() && !inputs.qa_mode }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          JOB_ID: ${{ inputs.job_id }}
          OUTPUT_KEY: renders/${{ inputs.job_id }}/output.mp4
          QA_REPORT_KEY: renders/${{ inputs.job_id }}/qa/report.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          try:
              import boto3
              s3=boto3.client('s3',endpoint_url=os.environ['R2_ENDPOINT'],aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],region_name='auto')
              report_path=Path('qa/report.json')
              report=json.loads(report_path.read_text()) if report_path.is_file() else None
              error=Path('qa-error.txt').read_text(encoding='utf-8') if Path('qa-error.txt').is_file() else '; '.join((report or {}).get('issues',[])) or 'workflow failed; inspect GitHub Actions logs'
              status={'job_id':os.environ['JOB_ID'],'status':'failed','quality_status':'failed' if report else 'not_checked',
                      'quality_report_key':os.environ['QA_REPORT_KEY'] if report else None,
                      'output_key':os.environ['OUTPUT_KEY'] if Path('output.mp4').is_file() else None,'error':error[:900]}
              s3.put_object(Bucket=os.environ['R2_BUCKET'],Key=f"renders/{os.environ['JOB_ID']}/status.json",Body=json.dumps(status).encode(),ContentType='application/json')
              print('Failure status saved to R2 for Worker reconciliation.', flush=True)
          except Exception as exc:
              print(f'Could not save failure status to R2: {type(exc).__name__}', flush=True)
          PY
      - name: Upload QA preview
        if: ${{ always() && inputs.qa_mode }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ inputs.job_id }}
          path: |
            output.mp4
            qa/
            qa-error.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload failed production QA evidence
        if: ${{ failure() && !inputs.qa_mode && hashFiles('qa/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-failed-${{ inputs.job_id }}
          path: |
            output.mp4
            qa/
            qa-error.txt
          if-no-files-found: ignore
          retention-days: 30

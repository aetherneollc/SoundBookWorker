name: Render episode
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Unique render job ID
        required: true
        type: string
      manifest_key:
        description: R2 object key for manifest JSON
        required: true
        type: string
      qa_mode:
        description: Render an isolated QA artifact without updating a studio episode
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: render-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install FFmpeg and Chinese font
        run: |
          python -m pip install imageio-ffmpeg==0.6.0
          sudo ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          mkdir -p "$HOME/.local/share/fonts"
          curl -fsSL --retry 3 --max-time 120 \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf \
            -o "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          curl -fsSL --retry 3 --max-time 120 \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Bold.otf \
            -o "$HOME/.local/share/fonts/NotoSansCJKsc-Bold.otf"
          fc-cache -f "$HOME/.local/share/fonts"
          ffmpeg -version | head -n 1
      - name: Install S3 client
        run: python -m pip install boto3 'qrcode[pil]' 'opencv-python-headless==4.12.0.88'
      - name: Download manifest and media
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MANIFEST_KEY: ${{ inputs.manifest_key }}
        run: |
          python - <<'PY'
          import os, boto3, json
          from pathlib import Path
          s3=boto3.client('s3',endpoint_url=os.environ['R2_ENDPOINT'],aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],region_name='auto')
          bucket=os.environ['R2_BUCKET']
          s3.download_file(bucket,os.environ['MANIFEST_KEY'],'manifest.json')
          doc=json.loads(Path('manifest.json').read_text())
          Path('media').mkdir(exist_ok=True)
          n=0
          seen={}
          def fetch(key):
              global n
              if not key or not isinstance(key, str):
                  return None
              if key in seen:
                  return seen[key]
              n+=1
              name=f"media/{n:05d}-{Path(key).name}"
              s3.download_file(bucket,key,name)
              seen[key]=name
              return name

          for group in [doc.get('shots',[]), [doc['audio']] if doc.get('audio') else [], doc.get('audio_tracks',[]), [doc['subtitle']] if doc.get('subtitle') else []]:
              for item in group:
                  local=fetch(item.get('key'))
                  if local:
                      item['file']=local

          for rig in doc.get('character_rigs', []):
              if not isinstance(rig, dict):
                  continue
              local=fetch(rig.get('master_key') or rig.get('key'))
              if local:
                  rig['master_file']=local
              side_local=fetch(rig.get('side_master_key'))
              if side_local:
                  rig['side_master_file']=side_local

          robot_rig=doc.get('robot_rig')
          if isinstance(robot_rig, dict):
              m_local=fetch(robot_rig.get('master_key') or robot_rig.get('key'))
              if m_local:
                  robot_rig['master_file']=m_local
              a_local=fetch(robot_rig.get('arm_key'))
              if a_local:
                  robot_rig['arm_file']=a_local
          if doc.get('robot_rig_key'):
              doc['robot_rig_file']=fetch(doc['robot_rig_key'])
          if doc.get('robot_arm_key'):
              doc['robot_arm_file']=fetch(doc['robot_arm_key'])

          # A character rig is a reusable set of R2 sprites, not a single image.
          for shot in doc.get('shots', []):
              plate=shot.get('plate')
              if isinstance(plate, dict):
                  for part in ('plate','far','near'):
                      local=fetch(plate.get(f'{part}_key'))
                      if local:
                          plate[f'{part}_file']=local
              if shot.get('robot_rig_key'):
                  shot['robot_rig_file']=fetch(shot['robot_rig_key'])
              if shot.get('robot_arm_key'):
                  shot['robot_arm_file']=fetch(shot['robot_arm_key'])
              rover=shot.get('rover')
              if isinstance(rover, dict):
                  if rover.get('rig_key'):
                      rover['rig_file']=fetch(rover['rig_key'])
                  if rover.get('arm_key'):
                      rover['arm_file']=fetch(rover['arm_key'])
              sm=shot.get('story_motion')
              if isinstance(sm, dict):
                  if isinstance(sm.get('plate'), dict):
                      for part in ('plate','far','near'):
                          local=fetch(sm['plate'].get(f'{part}_key'))
                          if local:
                              sm['plate'][f'{part}_file']=local
                  if sm.get('robot_rig_key'):
                      sm['robot_rig_file']=fetch(sm['robot_rig_key'])
                  if sm.get('robot_arm_key'):
                      sm['robot_arm_file']=fetch(sm['robot_arm_key'])
                  set_prop=sm.get('set_prop')
                  if isinstance(set_prop, dict):
                      prop_local=fetch(set_prop.get('prop_key'))
                      if prop_local:
                          set_prop['prop_file']=prop_local
                  for actor in sm.get('actors', []):
                      if not isinstance(actor, dict):
                          continue
                      if actor.get('rig_key'):
                          actor['rig_file']=fetch(actor['rig_key'])
                      if actor.get('side_rig_key'):
                          actor['side_rig_file']=fetch(actor['side_rig_key'])
              layers=shot.get('character_layers')
              if isinstance(layers, dict):
                  for part in ('background','body','head','arm_left','arm_right'):
                      local=fetch(layers.get(f'{part}_key'))
                      if local:
                          layers[f'{part}_file']=local
                  if isinstance(layers.get('mouth_keys'), dict):
                      layers['mouth_files']={}
                      for shape,key in layers['mouth_keys'].items():
                          if shape not in 'ABCDEFGHX' or not key:
                              continue
                          local=fetch(key)
                          if local:
                              layers['mouth_files'][shape]=local
              stage=shot.get('stage')
              if isinstance(stage, dict):
                  for part in ('background','foreground'):
                      local=fetch(stage.get(f'{part}_key'))
                      if local:
                          stage[f'{part}_file']=local
                  for actor in stage.get('cast', []):
                      if not isinstance(actor, dict) or not isinstance(actor.get('cells'), dict):
                          continue
                      for slot,key in list(actor['cells'].items()):
                          local=fetch(key)
                          if local:
                              actor['cells'][slot]=local
          Path('manifest.json').write_text(json.dumps(doc))
          PY
      - name: Select renderer
        id: renderer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          mode = 'godot2d' if str(doc.get('renderer') or '') == 'godot2d' else 'remotion'
          Path('renderer-mode').write_text(mode + '\n', encoding='utf-8')
          print('renderer=%s' % mode)
          PY
          echo "mode=$(tr -d '\r\n' < renderer-mode)" >> "$GITHUB_OUTPUT"
      - name: Cache MOSS models
        if: ${{ hashFiles('manifest.json') != '' }}
        uses: actions/cache@v4
        with:
          path: moss-tts-nano/models
          key: moss-nano-onnx-v1-${{ runner.os }}
      - name: Install MOSS CPU runtime
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('manifest.json').read_text())
          Path('needs-moss').write_text('yes' if doc.get('tts_engine')=='moss' else 'no')
          PY
          if [ "$(cat needs-moss)" = yes ]; then
            git clone https://github.com/OpenMOSS/MOSS-TTS-Nano.git moss-tts-source
            git -C moss-tts-source checkout 8b7bcc9341b3b4ef3a3a58ba1338a7d85ff133eb
            mkdir -p moss-tts-nano
            cp -a moss-tts-source/. moss-tts-nano/
            python -m pip install torch==2.7.0 torchaudio==2.7.0 --index-url https://download.pytorch.org/whl/cpu
            python -m pip install onnxruntime sentencepiece soundfile huggingface_hub transformers==4.57.1
            python -m pip install --no-deps -e moss-tts-nano
          fi
      - name: Generate MOSS speech
        run: |
          if [ "$(cat needs-moss)" = yes ]; then
            python renderer/synthesize.py manifest.json
          fi
      - name: Cache RTMPose wholebody models
        uses: actions/cache@v4
        with:
          path: ~/.cache/rtmlib
          key: rtmlib-wholebody-onnx-v1-${{ runner.os }}
      - name: Rig character and robot masters
        if: ${{ steps.renderer.outputs.mode != 'godot2d' }}
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('manifest.json').read_text())
          has_char=bool(doc.get('character_rigs')) or any(
              any(isinstance(a, dict) and (a.get('rig_file') or a.get('side_rig_file'))
                  for a in (s.get('story_motion') or {}).get('actors', []))
              for s in doc.get('shots', []) if isinstance(s, dict)
          )
          has_robot=bool(doc.get('robot_rig') or doc.get('robot_rig_file')) or any(
              s.get('robot_rig_file')
              or (isinstance(s.get('rover'), dict) and s['rover'].get('rig_file'))
              or (isinstance(s.get('story_motion'), dict) and s['story_motion'].get('robot_rig_file'))
              for s in doc.get('shots', []) if isinstance(s, dict)
          )
          if not (has_char or has_robot):
              raise SystemExit(1)
          PY
          then
            python -m pip install 'opencv-python-headless==4.12.0.88' onnxruntime rtmlib || python -m pip install 'opencv-python-headless==4.12.0.88'
            python renderer/rig_characters.py manifest.json
            python renderer/rig_robot.py manifest.json
          fi
      - name: Cache anime segmentation model
        if: ${{ steps.renderer.outputs.mode != 'godot2d' }}
        uses: actions/cache@v4
        with:
          path: character-model
          key: isnet-anime-onnx-v1-${{ runner.os }}
      - name: Install character layer runtime
        if: ${{ steps.renderer.outputs.mode != 'godot2d' }}
        continue-on-error: true
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path
          shots=json.loads(Path('manifest.json').read_text()).get('shots', [])
          def needs_cutout(shot):
              if not shot.get('file') or shot.get('stage') or shot.get('plate') or shot.get('fact_card') or shot.get('label'):
                  return False
              if isinstance(shot.get('character_layers'), dict) and shot['character_layers'].get('body_file'):
                  return False
              sm = shot.get('story_motion')
              if isinstance(sm, dict):
                  return not any(isinstance(a, dict) and (a.get('rig_key') or a.get('rig_file') or a.get('rig_json')) for a in sm.get('actors', []))
              return not shot.get('rover')
          if not any(needs_cutout(s) for s in shots if isinstance(s, dict)):
              raise SystemExit(1)
          PY
          then
            python -m pip install 'rembg[cpu]==2.0.67' 'opencv-python-headless==4.12.0.88'
          fi
      - name: Extract character layers
        if: ${{ steps.renderer.outputs.mode != 'godot2d' }}
        env:
          U2NET_HOME: character-model
        run: python renderer/layer_shots.py manifest.json || echo 'Character masking unavailable; using original shots'
      - name: Install phonetic lip sync when character mouth assets are present
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('manifest.json').read_text())
          shots=doc.get('shots', [])
          has_puppet_rigs=bool(doc.get('character_rigs')) or any(
              isinstance(s.get('story_motion'), dict) and any(
                  isinstance(a, dict) and (a.get('rig_key') or a.get('rig_file') or a.get('rig_json'))
                  for a in s['story_motion'].get('actors', [])
              )
              for s in shots if isinstance(s, dict)
          )
          if not (has_puppet_rigs or any(
              s.get('rover') or (isinstance(s.get('character_layers'), dict) and
              (s['character_layers'].get('mouth_files') or s['character_layers'].get('mouth_mode') == 'led'))
              for s in shots if isinstance(s, dict)
          )):
              raise SystemExit(1)
          PY
          then
            curl -fsSL --retry 3 https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.14.0/Rhubarb-Lip-Sync-1.14.0-Linux.zip -o rhubarb.zip
            echo 'a9a9074862cff47b2d59b8bf399a678a3b0b74f9452ad6ad94cb292913dd8667  rhubarb.zip' | sha256sum -c -
            unzip -q rhubarb.zip -d rhubarb-runtime
            echo "RHUBARB_BIN=$PWD/rhubarb-runtime/Rhubarb-Lip-Sync-1.14.0-Linux/rhubarb" >> "$GITHUB_ENV"
          fi
      - name: Mark running
        if: ${{ !inputs.qa_mode }}
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_TOKEN: ${{ secrets.CALLBACK_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 3 -sS -X POST "$CALLBACK_URL" -H "Authorization: Bearer $CALLBACK_TOKEN" -H 'Content-Type: application/json' -d "{\"job_id\":\"$JOB_ID\",\"status\":\"running\"}" || echo 'Running status callback failed; continuing with render'
      - name: Cache Godot 4.7.2
        if: ${{ steps.renderer.outputs.mode == 'godot2d' }}
        uses: actions/cache@v4
        with:
          path: .cache/godot-4.7.2
          key: godot-4.7.2-stable-linux-x86_64-v1
      - name: Install Godot software renderer
        if: ${{ steps.renderer.outputs.mode == 'godot2d' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb unzip ca-certificates mesa-utils \
            libgl1 libglu1-mesa libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 \
            libxext6 libxrender1 libxkbcommon0 libfontconfig1 \
            fonts-noto-cjk ffmpeg
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true
          python -m pip install scipy 'opencv-python-headless==4.12.0.88' onnxruntime rtmlib
      - name: Prepare Godot stage
        if: ${{ steps.renderer.outputs.mode == 'godot2d' }}
        run: python renderer/prepare_stage.py manifest.json stage.json
      - name: Render MP4 with Godot 2D
        if: ${{ steps.renderer.outputs.mode == 'godot2d' }}
        run: bash scripts/render_godot2d.sh stage.json output.mp4
      - name: Install Remotion
        if: ${{ steps.renderer.outputs.mode != 'godot2d' }}
        run: npm ci
      - name: Prepare frame-accurate timeline
        if: ${{ steps.renderer.outputs.mode != 'godot2d' }}
        run: python renderer/prepare_remotion.py manifest.json remotion-props.json
      - name: Render MP4 with Remotion
        if: ${{ steps.renderer.outputs.mode != 'godot2d' }}
        run: npm run render
      - name: Upload result
        if: ${{ !inputs.qa_mode }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          OUTPUT_KEY: renders/${{ inputs.job_id }}/output.mp4
        run: |
          python - <<'PY'
          import os,boto3
          s3=boto3.client('s3',endpoint_url=os.environ['R2_ENDPOINT'],aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],region_name='auto')
          s3.upload_file('output.mp4',os.environ['R2_BUCKET'],os.environ['OUTPUT_KEY'],ExtraArgs={'ContentType':'video/mp4'})
          PY
      - name: Mark succeeded
        if: ${{ success() && !inputs.qa_mode }}
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_TOKEN: ${{ secrets.CALLBACK_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
          OUTPUT_KEY: renders/${{ inputs.job_id }}/output.mp4
        run: |
          curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 3 -sS -X POST "$CALLBACK_URL" -H "Authorization: Bearer $CALLBACK_TOKEN" -H 'Content-Type: application/json' -d "{\"job_id\":\"$JOB_ID\",\"status\":\"succeeded\",\"output_key\":\"$OUTPUT_KEY\"}"
      - name: Mark failed
        if: ${{ failure() && !inputs.qa_mode }}
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_TOKEN: ${{ secrets.CALLBACK_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 3 -sS -X POST "$CALLBACK_URL" -H "Authorization: Bearer $CALLBACK_TOKEN" -H 'Content-Type: application/json' -d "{\"job_id\":\"$JOB_ID\",\"status\":\"failed\",\"error\":\"workflow failed; inspect GitHub Actions logs\"}" || true
      - name: Upload QA preview
        if: ${{ success() && inputs.qa_mode }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ inputs.job_id }}
          path: output.mp4
          retention-days: 7

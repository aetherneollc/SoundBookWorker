name: Render episode
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Unique render job ID
        required: true
        type: string
      manifest_key:
        description: R2 object key for manifest JSON
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: render-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install S3 client
        run: python -m pip install boto3 'qrcode[pil]'
      - name: Download manifest and media
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MANIFEST_KEY: ${{ inputs.manifest_key }}
        run: |
          python - <<'PY'
          import os, boto3, json
          from pathlib import Path
          s3=boto3.client('s3',endpoint_url=os.environ['R2_ENDPOINT'],aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],region_name='auto')
          bucket=os.environ['R2_BUCKET']
          s3.download_file(bucket,os.environ['MANIFEST_KEY'],'manifest.json')
          doc=json.loads(Path('manifest.json').read_text())
          Path('media').mkdir(exist_ok=True)
          n=0
          for group in [doc.get('shots',[]), [doc['audio']] if doc.get('audio') else [], doc.get('audio_tracks',[]), [doc['subtitle']] if doc.get('subtitle') else []]:
              for item in group:
                  key=item.get('key')
                  if key:
                      n+=1
                      name=f"media/{n:05d}-{Path(key).name}"
                      s3.download_file(bucket,key,name)
                      item['file']=name
          Path('manifest.json').write_text(json.dumps(doc))
          PY
      - name: Cache MOSS models
        if: ${{ hashFiles('manifest.json') != '' }}
        uses: actions/cache@v4
        with:
          path: moss-tts-nano/models
          key: moss-nano-onnx-v1-${{ runner.os }}
      - name: Install MOSS CPU runtime
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('manifest.json').read_text())
          Path('needs-moss').write_text('yes' if doc.get('tts_engine')=='moss' else 'no')
          PY
          if [ "$(cat needs-moss)" = yes ]; then
            git clone https://github.com/OpenMOSS/MOSS-TTS-Nano.git moss-tts-source
            git -C moss-tts-source checkout 8b7bcc9341b3b4ef3a3a58ba1338a7d85ff133eb
            mkdir -p moss-tts-nano
            cp -a moss-tts-source/. moss-tts-nano/
            python -m pip install torch==2.7.0 torchaudio==2.7.0 --index-url https://download.pytorch.org/whl/cpu
            python -m pip install onnxruntime sentencepiece soundfile huggingface_hub transformers==4.57.1
            python -m pip install --no-deps -e moss-tts-nano
          fi
      - name: Generate MOSS speech
        run: |
          if [ "$(cat needs-moss)" = yes ]; then
            python renderer/synthesize.py manifest.json
          fi
      - name: Mark running
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_TOKEN: ${{ secrets.CALLBACK_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          curl --fail-with-body -sS -X POST "$CALLBACK_URL" -H "Authorization: Bearer $CALLBACK_TOKEN" -H 'Content-Type: application/json' -d "{\"job_id\":\"$JOB_ID\",\"status\":\"running\"}"
      - name: Render MP4
        run: python renderer/render.py manifest.json output.mp4
      - name: Upload result
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          OUTPUT_KEY: renders/${{ inputs.job_id }}/output.mp4
        run: |
          python - <<'PY'
          import os,boto3
          s3=boto3.client('s3',endpoint_url=os.environ['R2_ENDPOINT'],aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],region_name='auto')
          s3.upload_file('output.mp4',os.environ['R2_BUCKET'],os.environ['OUTPUT_KEY'],ExtraArgs={'ContentType':'video/mp4'})
          PY
      - name: Mark succeeded
        if: success()
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_TOKEN: ${{ secrets.CALLBACK_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
          OUTPUT_KEY: renders/${{ inputs.job_id }}/output.mp4
        run: |
          curl --fail-with-body -sS -X POST "$CALLBACK_URL" -H "Authorization: Bearer $CALLBACK_TOKEN" -H 'Content-Type: application/json' -d "{\"job_id\":\"$JOB_ID\",\"status\":\"succeeded\",\"output_key\":\"$OUTPUT_KEY\"}"
      - name: Mark failed
        if: failure()
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_TOKEN: ${{ secrets.CALLBACK_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          curl -sS -X POST "$CALLBACK_URL" -H "Authorization: Bearer $CALLBACK_TOKEN" -H 'Content-Type: application/json' -d "{\"job_id\":\"$JOB_ID\",\"status\":\"failed\",\"error\":\"workflow failed; inspect GitHub Actions logs\"}" || true
